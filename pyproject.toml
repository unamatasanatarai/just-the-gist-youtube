[project]
name = "yt-summarize"
version = "0.1.0"
description = "Fetch YouTube transcripts and summarize them with Gemini"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.33.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-slugify>=9.1.3",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
yt-transcript = "yt_summarize.transcript:main"
yt-summarize = "yt_summarize.summarize:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
